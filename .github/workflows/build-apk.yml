
name: Build 3D Flappy Bird APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir project
          unzip -q 3D_Flappy_Bird_Android_Studio_Project.zip -d project
          find project -name gradlew -exec chmod +x {} \;

      - name: Build APK
        run: |
          WRAPPER=$(find project -name gradlew -print -quit)
          test -n "$WRAPPER"
          cd "$(dirname "$WRAPPER")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Flappy-Bird-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

